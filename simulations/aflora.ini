# AFLoRa behaviour on top of FLoRa 1.3.2.
#
# Include it from a scenario ini (`include aflora.ini`, relative to that ini). Every AFLoRa
# mechanism ported on this branch keeps FLoRa 1.3.2's behaviour by default; this file switches
# on the ones that apply to every device, with AFLoRa's values. See AFLORA.md.

[General]
# End-device duty cycle: 1% of the airtime of a 20 B frame at CR 4/8, from the start of the frame
**.LoRaNic.mac.dutyCycleEnabled = true
# Receive windows: RX1 at 1 s and RX2 at 2 s after the end of the uplink, 0.2 s each
**.LoRaNic.mac.receiveDelay1 = 1s
**.LoRaNic.mac.receiveWindow1 = 0.2s
**.LoRaNic.mac.receiveDelay2 = 2s
**.LoRaNic.mac.receiveWindow2 = 0.2s
# The network server answers 1.002 s after the first copy of an uplink, inside RX1
**.networkServer.app[*].gatewayWaitTime = 1.002s
# Semtech airtime formula (low data rate optimisation at SF11-12), devices and gateways
**.radio.transmitter.airtimeFormula = "aflora"
# Gateway downlink duty-cycle table with AFLoRa's SF8 and SF10 values
**.LoRaGWNic.mac.dutyCycleTable = "aflora"

# Scenario choices, AFLoRa's defaults shown:
# **.loRaNodes[*].app[0].confirmedTx = false      # confirmed uplinks, answered with an ACK
# **.loRaNodes[*].LoRaNic.mac.sfModePar = "SFM0"  # SF on retransmissions: SFM0..SFM3
# **.loRaNodes[*].LoRaNic.mac.maxRetry = 8        # transmissions of a confirmed uplink
# **.loRaNodes[*].LoRaNic.mac.maxQueueSize = -1   # AFLoRa's example scenarios used 1
# **.networkServer.app[*].initialLoRaTP = 14dBm   # downlink TX power
