# Our changes on top of FLoRa 1.3.2 and AFLoRa (layer 3 of this branch).
#
# Include it from a scenario ini (`include ours.ini`, relative to that ini), together with
# aflora.ini if AFLoRa's behaviour is wanted too (the two files set different parameters). Every
# change of ours keeps the behaviour of the layers below by default; this file switches on the
# ones that apply to every scenario. See OURS.md.

[General]
# Airtime of the frame actually built (MAC header + app payload), not FLoRa's fixed 20 B / 15 B
**.radio.transmitter.airtimePayload = "frame"

# Scenario choices, defaults shown:
# **.LoRaMedium.pathLoss.PL_d0_db = 127.41dB          # our scenarios: 103.139dB with d0 = 100m
# **.LoRaMedium.pathLoss.enableRayleighFading = false
# **.LoRaMedium.pathLoss.fixedMeanSnrDb = nan          # fixed-SNR mode when set
# **.LoRaMedium.pathLoss.fixedTxPowerDbm = 14
# **.loRaNodes[*].LoRaNic.mac.headerLength = 17B       # CsmaCaMac's; LoRaWAN 13B, ns-3 9B
